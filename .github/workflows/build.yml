name: Windows 构建

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# 同一分支/标签只保留一次构建，避免重复打 Release 时互相覆盖资产。
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: 检查与打包
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # 生成更新日志需要历史标签

      - name: 设置 Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: 缓存 cargo
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: 版本一致性（标签必须等于 package.json / tauri.conf.json）
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "tag=$tag package.json=$pkg tauri.conf.json=$conf"
          if [ "$tag" != "$pkg" ] || [ "$tag" != "$conf" ]; then
            echo "::error::标签 $GITHUB_REF_NAME 与 package.json($pkg)/tauri.conf.json($conf) 版本不一致"
            exit 1
          fi

      - name: 前端依赖
        run: npm ci

      - name: 前端检查
        run: |
          npm run typecheck
          npm test
          npm run build

      - name: Rust 检查
        working-directory: src-tauri
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets -- -D warnings
          cargo test

      - name: 清理历史安装包
        shell: bash
        run: rm -rf src-tauri/target/release/bundle/nsis

      - name: 打包（NSIS + 更新签名）
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: npx tauri build --bundles nsis

      - name: 生成校验值
        shell: bash
        run: |
          set -e
          out=src-tauri/target/release
          (cd "$out" && sha256sum wrt-ui.exe > wrt-ui.exe.sha256)
          (cd "$out/bundle/nsis" && sha256sum *.exe > SHA256SUMS.txt)
          ls -l "$out/bundle/nsis"

      - name: 生成更新日志
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          prev=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          echo "previous tag: ${prev:-<none>}"
          {
            echo "## 安装说明"
            echo
            echo "- 下载 **NSIS 安装包**（\`*-setup.exe\`）安装即可，无需额外依赖。"
            echo "- 安装包未做代码签名，首次运行系统会提示“未知发布者”，请核对 SHA256 后再放行。"
            echo "- 用户数据保存在 `%LOCALAPPDATA%/WRT-UI`（设置页“05 数据目录”可直接打开），覆盖安装不会清空；卸载默认保留。"
            echo
            echo "## 校验"
            echo
            echo '```'
            cat src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
            cat src-tauri/target/release/wrt-ui.exe.sha256
            echo '```'
            echo
            echo "## 提交记录"
            echo
            if [ -n "$prev" ]; then
              git log --no-merges --pretty='- %s (%h)' "$prev..HEAD"
            else
              git log -n 30 --no-merges --pretty='- %s (%h)'
            fi
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: 生成更新清单
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: node scripts/make-update-json.mjs "${GITHUB_REF_NAME#v}" "${{ github.repository }}" RELEASE_NOTES.md

      - name: 上传产物
        uses: actions/upload-artifact@v7.0.2
        with:
          name: wrt-ui-windows-x64
          path: |
            src-tauri/target/release/wrt-ui.exe
            src-tauri/target/release/wrt-ui.exe.sha256
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
            src-tauri/target/release/bundle/nsis/*.exe.sig
            update.json
            update-proxy.json
            RELEASE_NOTES.md
          if-no-files-found: error

      - name: 创建 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3.0.4
        with:
          name: WRT-UI ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          # 带 -alpha/-beta/-rc 的标签自动标记为预发布
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
          fail_on_unmatched_files: true

      # 滚动发布更新清单：应用内 updater 从 updater 标签读取 update.json / update-proxy.json
      - name: 发布更新清单（updater 标签）
        if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
        uses: softprops/action-gh-release@v3.0.4
        with:
          tag_name: updater
          name: 更新清单
          body: |
            由 CI 自动生成的 Tauri updater 清单，应用内直接读取，请勿手动修改。
            国内网络可用 `update-proxy.json`（经 ghproxy 加速下载）。
          make_latest: "false"
          files: |
            update.json
            update-proxy.json
          fail_on_unmatched_files: true
