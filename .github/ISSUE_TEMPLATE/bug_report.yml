name: Bug 报告
description: 报告一个可复现的问题（崩溃、构建失败、界面异常等）
title: "[Bug] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。提交前请先搜索 [已有 issue](https://github.com/MinimaxFlora/WRT-UI/issues?q=is%3Aissue)，避免重复。
        崩溃类问题请附上日志：数据目录下的 `jobs/<id>/build.log`，或用 `wrt-ui.exe` 启动时的控制台输出。

  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过现有 issue，确认不是重复问题
          required: true
        - label: 我使用的是最新版本（设置页「07 更新」显示已是最新）
          required: true

  - type: textarea
    id: what-happened
    attributes:
      label: 问题现象
      description: 实际发生了什么？期望是什么？
      placeholder: |
        实际：点击「开始构建」后进度停在「下载镜像」，5 分钟后报错。
        期望：正常进入编译阶段。
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 按顺序写清楚，包含选择的生态、固件版本、设备与软件包
      placeholder: |
        1. 生态选 ImmortalWrt，版本 24.10.2
        2. 设备选 Xiaomi AX3000T
        3. 软件包只加 luci-app-honk
        4. 点下一步 → 确认构建
    validations:
      required: true

  - type: dropdown
    id: engine
    attributes:
      label: 构建引擎
      options:
        - 内置 VM 引擎
        - WSL Containers
        - Docker
        - 未进入构建阶段（界面问题）
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: WRT-UI 版本
      description: 设置页「07 更新」里的当前版本，或安装包文件名
      placeholder: "1.0.0"
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows 版本
      placeholder: "Windows 11 23H2 (22631.4460)"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志 / 截图
      description: 粘贴 `build.log` 结尾 50 行或拖入截图（注意不要包含密码、代理账号等敏感信息）
      render: shell
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: 其他信息
      description: 是否使用了代理、自定义软件源、非默认数据目录等
    validations:
      required: false
