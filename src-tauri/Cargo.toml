[package]
name = "firmforge"
version = "1.3.4"
description = "FirmForge desktop firmware builder"
edition = "2021"
license = "MIT"
repository = "https://github.com/FirmForge/FirmForge"
rust-version = "1.77"

[lib]
name = "firmforge_lib"
# 桌面构建只需要 rlib；cdylib 在 windows-gnu 下会产生超出 PE 限制的导出序号
# （ld: export ordinal too large），而移动端才需要 staticlib/cdylib。
crate-type = ["rlib"]

[workspace]
members = ["core"]
resolver = "2"

[build-dependencies]
tauri-build = { version = "3.0.0-alpha.4", features = [] }

[dependencies]
# 业务核心与桌面外壳分离：核心可在无 WebView2 的环境里单测。
firmforge-core = { path = "core" }
tauri = { version = "3.0.0-alpha.6", features = ["tray-icon", "devtools"] }
# Tauri 3 把 webview 运行时从 tauri 的 feature 里取出，必须显式依赖并在 Builder 里选择
tauri-runtime-wry = "3.0.0-alpha.6"
tauri-plugin-single-instance = "3.0.0-alpha.3"
tauri-plugin-autostart = "3.0.0-alpha.3"
tauri-plugin-notification = "3.0.0-alpha.3"
tauri-plugin-updater = "3.0.0-alpha.3"
tauri-plugin-process = "3.0.0-alpha.3"
tauri-plugin-dialog = "3.0.0-alpha.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs", "time", "sync", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["native-tls"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
tar = "0.4"
dirs = "6"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
