name: 功能请求
description: 建议一个新功能或改进现有行为
title: "[Feature] "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        请先确认这不是已有功能：`docs/FEATURE_PARITY.md` 与 README 列出了当前能力。

  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过现有 issue 与文档，确认没有相同建议
          required: true

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述场景与痛点，不要直接写实现方案
      placeholder: 每次换设备都要手动重选软件包，想按设备记住上次的软件包组合。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的做法
      description: 你希望界面或流程变成什么样？
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 现在你用什么方式绕开这个问题？
    validations:
      required: false

  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      options:
        - 构建流程
        - 界面与交互
        - 设置与数据
        - 打包与发布
        - 文档
        - 其他
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 截图、参考项目、相关链接
    validations:
      required: false
