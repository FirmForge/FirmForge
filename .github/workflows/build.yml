name: Windows 构建

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: 发布版本号（如 v1.0.0），留空则只构建不上传
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    name: 检查与打包
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: 缓存 cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: 前端依赖
        run: npm ci

      - name: 前端检查
        run: |
          npm run typecheck
          npm test
          npm run build

      - name: Rust 检查
        working-directory: src-tauri
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets -- -D warnings
          cargo test

      - name: 安装 Tauri CLI
        run: npm i -D @tauri-apps/cli@^2

      - name: 打包（NSIS）
        run: npx tauri build --bundles nsis

      - name: 生成校验值
        shell: bash
        run: |
          cd src-tauri/target/release
          sha256sum wrt-ui.exe > wrt-ui.exe.sha256 || true
          cd bundle/nsis 2>/dev/null && sha256sum *.exe > SHA256SUMS.txt || true

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: wrt-ui-windows-x64
          path: |
            src-tauri/target/release/wrt-ui.exe
            src-tauri/target/release/wrt-ui.exe.sha256
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
          if-no-files-found: error

      - name: 创建 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
          generate_release_notes: true
          body: |
            Windows x64 安装包（NSIS）。未做代码签名，首次运行会有"未知发布者"提示。
            SHA256 校验值见 SHA256SUMS.txt。安装后用户数据保存在 `%LOCALAPPDATA%\WRT-UI`。
          fail_on_unmatched_files: true
